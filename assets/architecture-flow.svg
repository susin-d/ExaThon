<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#121e33" />
    </linearGradient>
    <linearGradient id="box-exasol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#16223b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00C2A8" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F5A524" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="420" rx="14" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Exasol Boundary -->
  <rect x="290" y="35" width="480" height="350" rx="12" fill="url(#box-exasol)" stroke="#E5484D" stroke-width="1.8" stroke-dasharray="6,4" />
  <rect x="306" y="24" width="310" height="24" rx="6" fill="#E5484D" />
  <text x="316" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EXASOL PERSONAL · TEXT NEVER LEAVES DB</text>

  <!-- Node 1: Sources -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="200" height="250" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect width="200" height="34" rx="10" fill="#0f172a" />
    <text x="100" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TICKET SOURCES</text>
    
    <g transform="translate(18, 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      <rect x="0" y="0" width="164" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="18">🏢 Branch Network</text>

      <rect x="0" y="38" width="164" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="56">🎧 Call Center Logs</text>

      <rect x="0" y="76" width="164" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="94">✉️ Customer Email</text>

      <rect x="0" y="114" width="164" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="132">📱 Mobile Banking App</text>

      <rect x="0" y="152" width="164" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="170">🏛️ RBI CMS Escalations</text>
    </g>
  </g>

  <!-- Node 2: Raw Storage inside Exasol -->
  <g transform="translate(320, 75)" filter="url(#shadow)">
    <rect width="180" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RAW TICKETS &amp; REF</text>
    <text x="90" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">TICKETS (60K+)</text>
    <text x="90" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">RBI_GROUNDS, BRANCHES</text>
  </g>

  <!-- Node 3: Python UDF Engine -->
  <g transform="translate(540, 75)" filter="url(#shadow)">
    <rect width="200" height="115" rx="8" fill="#1c1917" stroke="#F5A524" stroke-width="1.5" />
    <rect width="200" height="26" rx="8" fill="#F5A524" />
    <text x="100" y="18" fill="#0c0a09" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PYTHON 3.12 UDFs</text>
    <text x="16" y="50" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">· Classify (Complaint/Query)</text>
    <text x="16" y="70" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">· Map to RBI Grounds</text>
    <text x="16" y="90" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">· Extract Triggers &amp; Amounts</text>
    <text x="16" y="106" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">· TF-IDF Cluster Discovery</text>
  </g>

  <!-- Node 4: Insight Tables inside Exasol -->
  <g transform="translate(320, 245)" filter="url(#shadow)">
    <rect width="420" height="110" rx="8" fill="#0f172a" stroke="#00C2A8" stroke-width="1.5" />
    <text x="210" y="26" fill="#00C2A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">IN-DATABASE DERIVED ANALYTICS</text>
    <text x="210" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">TICKET_INSIGHTS (predictions, triggers, ground tags)</text>
    <text x="210" y="70" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">CLUSTERS (volume, WoW growth %, first seen, onset)</text>
    <text x="210" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">SQL Window Functions: Branch concentration &amp; Escalation gap</text>
  </g>

  <!-- Node 5: Ombudsman UI -->
  <g transform="translate(830, 80)" filter="url(#shadow)">
    <rect width="230" height="150" rx="10" fill="#00C2A8" fill-opacity="0.1" stroke="#00C2A8" stroke-width="1.8" />
    <rect width="230" height="32" rx="10" fill="#00C2A8" />
    <text x="115" y="21" fill="#0a2a22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">OMBUDSMAN WORKSPACE</text>
    <g transform="translate(14, 46)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#e2e8f0">
      <text x="0" y="16">1. Root-Cause Board</text>
      <text x="0" y="34">2. Misclassification Watchlist</text>
      <text x="0" y="52">3. Escalation Gap morning list</text>
      <text x="0" y="70">4. Cluster Drilldown &amp; Timeline</text>
      <text x="0" y="88">5. RBI Top-Five Grounds</text>
    </g>
  </g>

  <!-- Node 6: MCP Server -->
  <g transform="translate(830, 265)" filter="url(#shadow)">
    <rect width="230" height="90" rx="10" fill="#9B5DE5" fill-opacity="0.1" stroke="#9B5DE5" stroke-width="1.8" />
    <rect width="230" height="28" rx="10" fill="#9B5DE5" />
    <text x="115" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXASOL MCP SERVER (READ-ONLY)</text>
    <text x="115" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">Natural Language Interface</text>
    <text x="115" y="70" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">“Which branches drove ATM delays?”</text>
  </g>

  <!-- Connectors -->
  <!-- Sources to Raw Tickets -->
  <path d="M 240 180 L 320 120" stroke="#00C2A8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Raw Tickets to UDFs -->
  <path d="M 500 120 L 540 120" stroke="#F5A524" stroke-width="2" fill="none" marker-end="url(#arrow-gold)" />
  <!-- UDFs to Analytics -->
  <path d="M 640 190 L 640 245" stroke="#F5A524" stroke-width="2" fill="none" marker-end="url(#arrow-gold)" />
  <!-- Raw to Analytics -->
  <path d="M 410 165 L 410 245" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
  <!-- Analytics to UI -->
  <path d="M 740 280 L 830 180" stroke="#00C2A8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Analytics to MCP -->
  <path d="M 740 310 L 830 310" stroke="#9B5DE5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- MCP to UI -->
  <path d="M 945 265 L 945 230" stroke="#9B5DE5" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
</svg>
