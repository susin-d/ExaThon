<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="50%" stop-color="#0e1d24" />
      <stop offset="100%" stop-color="#12272e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2A8" />
      <stop offset="50%" stop-color="#F5A524" />
      <stop offset="100%" stop-color="#E5484D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)" stroke="#1e3a44" stroke-width="2"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#00C2A8" stroke-width="0.75">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="220" cy="170" r="140" fill="#00C2A8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="170" r="140" fill="#F5A524" opacity="0.07" filter="url(#glow)"/>

  <!-- Badges / Header pill -->
  <g transform="translate(60, 48)">
    <rect width="260" height="28" rx="14" fill="#00C2A8" fill-opacity="0.15" stroke="#00C2A8" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#00C2A8"/>
    <text x="30" y="18" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXATHON 2026 · TRACK 01</text>
  </g>

  <!-- Title -->
  <text x="60" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Complaint Root-Cause Engine</text>

  <!-- Subtitle -->
  <text x="60" y="180" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Find the root cause before RBI does.</text>

  <!-- Description paragraph -->
  <text x="60" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    <tspan x="60" dy="0">Evidence-first complaint investigation workspace for Internal Ombudsmen.</tspan>
    <tspan x="60" dy="24">Runs in-database with Exasol Python UDFs · Text never leaves the bank's sovereign boundary.</tspan>
  </text>

  <!-- Tech tags at bottom -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#182c35" stroke="#2a4755" stroke-width="1"/>
    <text x="65" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Exasol Personal</text>

    <rect x="142" y="0" width="115" height="26" rx="6" fill="#182c35" stroke="#2a4755" stroke-width="1"/>
    <text x="199" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python 3.12 UDFs</text>

    <rect x="269" y="0" width="115" height="26" rx="6" fill="#182c35" stroke="#2a4755" stroke-width="1"/>
    <text x="326" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TF-IDF Cluster</text>

    <rect x="396" y="0" width="125" height="26" rx="6" fill="#182c35" stroke="#2a4755" stroke-width="1"/>
    <text x="458" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RBI Appendix 1</text>
  </g>
</svg>
