services:
  - type: web
    name: complaint-root-cause-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATA_BACKEND
        value: demo
      - key: QUEUE_ENABLED
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
